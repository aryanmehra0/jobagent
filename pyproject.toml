[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-job-agent"
version = "0.2.0"
description = "Local, autonomous AI job search and application agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "click>=8.1.7",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "psycopg[binary]>=3.2.0",
    "pandas>=2.0.0",
    "python-jobspy>=1.1.50",
    "sentence-transformers>=2.7.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "typst>=0.11.0",
    "playwright>=1.44.0",
    "playwright-stealth>=2.0.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
# LLM-backed extraction, re-ranking, tailoring, and outreach. Without these the
# pipeline runs end to end on its deterministic fallbacks.
llm = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "llama-parse>=0.4.0",
]
dev = [
    "pytest>=8.2.0",
    "reportlab>=4.1.0",
]

[project.scripts]
job-agent = "job_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The flow console dashboard is served from disk at runtime, so its assets must
# travel with the package rather than being left behind by a wheel build.
"job_agent.web" = ["static/*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
